openapi: 3.1.0
info:
  title: StealthBridge Testnet API
  version: 0.1.0
  description: >
    Experimental, read-only API contract. Settlement initiation deliberately returns 501
    until cryptographic integration, custody and compliance reviews are complete.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Service health
      responses:
        '200':
          description: Ready
  /v1/capabilities:
    get:
      summary: Explicitly advertise which features are verified and enabled
      responses:
        '200':
          description: Current capability flags
  /v1/corridors:
    get:
      summary: List configured demo corridors
      responses:
        '200':
          description: Demo corridors only
  /v1/settlements:
    post:
      summary: Initiate settlement (disabled in Sprint 0)
      responses:
        '501':
          description: Not implemented
